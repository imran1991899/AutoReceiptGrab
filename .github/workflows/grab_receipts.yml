name: Process Grab Receipts

on:
  workflow_dispatch: # Allows you to trigger it manually anytime from GitHub Actions tab
  schedule:
    - cron: '0 0 1 * *' # Runs automatically on the 1st of every month (optional)

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies (Poppler for PDF handling)
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-auth-oauthlib google-api-python-client Pillow pdf2image beautifulsoup4 requests

      - name: Run receipt extraction and grid generator
        env:
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
        run: python process_receipts.py
