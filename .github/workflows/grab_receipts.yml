name: Process Grab Receipts

on:
  schedule:
    - cron: '0 0 * * 0' # Runs weekly, adjust as needed
  workflow_dispatch:     # Allows manual triggering

jobs:
  run-receipt-processor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib pillow beautifulsoup4 pdf2image requests

      - name: Install System Dependencies (Poppler for PDF conversion)
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Generate config.json from GitHub Secrets
        run: |
          cat << EOF > config.json
          {
            "GMAIL_CLIENT_ID": "${{ secrets.GMAIL_CLIENT_ID }}",
            "GMAIL_CLIENT_SECRET": "${{ secrets.GMAIL_CLIENT_SECRET }}",
            "GMAIL_REFRESH_TOKEN": "${{ secrets.GMAIL_REFRESH_TOKEN }}",
            "GOOGLE_DRIVE_FOLDER_ID": "${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}"
          }
          EOF

      - name: Run Receipt Processor Script
        run: python process_receipts.py
